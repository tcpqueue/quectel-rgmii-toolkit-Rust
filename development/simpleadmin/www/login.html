<!doctype html>
<html data-bs-theme="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>获取中... 登录</title>
<script src="js/locales.js?v=3.5"></script>
<script>
(function () {
  try {
    var stored = localStorage.getItem('theme');
    var theme = stored === 'dark' || stored === 'light' ? stored
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-bs-theme', theme);
    document.documentElement.style.colorScheme = theme;
  } catch (e) {
    document.documentElement.setAttribute('data-bs-theme', 'light');
  }
})();
</script>
<link href="css/app.css?v=4.0" rel="stylesheet">
<link href="favicon.ico" rel="icon">
<style>
body { display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
.login-shell { width: min(380px, 100%); display: grid; gap: 22px; }
.login-brand { display: grid; justify-items: center; gap: 12px; text-align: center; }
.login-brand .sa-brand-mark { width: 72px; height: 72px; border-radius: 17px; font-size: 26px; }
.login-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.login-subtitle { margin-top: 2px; color: var(--secondary); font-size: 14px; }
.login-fields .ui-row { flex-wrap: nowrap; }
.login-fields .ui-row > label { min-width: 72px; }
.login-fields .form-control { flex: 1; min-width: 0; }
.login-fields .form-control { background: transparent; padding-left: 0; padding-right: 0; }
.login-fields .form-control:focus { background: transparent; box-shadow: none; }
.login-fields .ui-row:focus-within { background: color-mix(in srgb, var(--tint) 6%, transparent); }
#loginButton { width: 100%; margin-top: 16px; }
.message { min-height: 20px; margin-top: 10px; color: var(--red); font-size: 13px; text-align: center; }
.login-prefs { display: flex; justify-content: center; gap: 10px; }
.login-prefs .form-select { width: auto; min-height: 32px; padding-top: 5px; padding-bottom: 5px; font-size: 13px; background-color: var(--fill); }
.login-footer { text-align: center; font-size: 12px; line-height: 1.8; color: var(--tertiary); }
.login-footer a { color: var(--secondary); }
#username, #password, .login-title, .sa-brand-mark { direction: ltr; }
</style>
</head>
<body>
  <main class="login-shell" aria-label="登录">
    <div class="login-brand">
      <div class="sa-brand-mark" data-simpleadmin-brand-mark="1">--</div>
      <div>
        <div class="login-title" data-simpleadmin-brand-title="1">获取中...</div>
        <div class="login-subtitle">请输入账号和密码</div>
      </div>
    </div>
    <form id="loginForm" autocomplete="on">
      <div class="ui-card login-fields">
        <div class="ui-row"><label for="username">用户名</label><input id="username" class="form-control" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="必填" required></div>
        <div class="ui-row"><label for="password">密码</label><input id="password" class="form-control" name="password" type="password" autocomplete="current-password" placeholder="必填" required></div>
      </div>
      <button id="loginButton" class="btn btn-primary btn-lg" type="submit">登录</button>
      <div id="loginMessage" class="message" role="alert"></div>
    </form>
    <div class="login-prefs">
      <select id="loginLanguage" class="form-select" aria-label="语言" data-no-i18n><option value="zh-CN">中文</option><option value="en">English</option></select>
      <select id="themeSelect" class="form-select" aria-label="外观"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select>
    </div>
    <footer class="login-footer" data-no-i18n><div>Monologue&amp;蓝天科技 版权所有</div><div>问题反馈 <a href="https://github.com/tcpqueue/quectel-rgmii-toolkit-Rust/issues">GitHub Issues</a></div></footer>
  </main>
<script>
(function () {
  'use strict';
  const form = document.getElementById('loginForm');
  const button = document.getElementById('loginButton');
  const message = document.getElementById('loginMessage');
  const lang = window.SimpleAdmin.Lang;
  const languageSelect = document.getElementById('loginLanguage');
  languageSelect.value = lang.getCurrentLanguage();
  languageSelect.addEventListener('change', () => lang.setLanguage(languageSelect.value));
  window.addEventListener('simpleadmin:language-changed', () => {
    document.title = (document.querySelector('[data-simpleadmin-brand-title]').textContent || 'SimpleAdmin') + ' · ' + lang.t('登录');
  });
  const themeSelect = document.getElementById('themeSelect');
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function storedTheme() {
    try { const value = localStorage.getItem('theme'); return value === 'light' || value === 'dark' ? value : 'auto'; } catch (e) { return 'auto'; }
  }
  function applyTheme(choice) {
    const theme = choice === 'auto' ? (darkQuery && darkQuery.matches ? 'dark' : 'light') : choice;
    document.documentElement.setAttribute('data-bs-theme', theme);
    document.documentElement.style.colorScheme = theme;
    themeSelect.value = choice;
  }
  function normalizeModel(value) {
    var text = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
    if (!text || text === '-' || text === '未知' || text === '获取中...') return '';
    return text;
  }
  function modelMark(value) {
    var model = normalizeModel(value);
    var chars = model.replace(/[^0-9A-Za-z\u4e00-\u9fa5]/g, '').split('');
    return chars.length ? chars.slice(0, 2).join('').toUpperCase() : '--';
  }
  function applyBrandModel(value) {
    var model = normalizeModel(value) || 'SimpleAdmin';
    document.querySelectorAll('[data-simpleadmin-brand-title]').forEach(function (element) {
      element.textContent = model;
    });
    document.querySelectorAll('[data-simpleadmin-brand-mark]').forEach(function (element) {
      element.textContent = modelMark(model);
    });
    document.title = model + ' · ' + lang.t('登录');
    try { localStorage.setItem('simpleadmin.moduleModelName', model); } catch (e) {}
  }
  function initBrandModel() {
    try {
      var cached = normalizeModel(localStorage.getItem('simpleadmin.moduleModelName'));
      if (cached) applyBrandModel(cached);
    } catch (e) {}
    fetch('/api/module_model?force=1', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (response) {
        if (!response.ok) throw new Error('model status ' + response.status);
        return response.json();
      })
      .then(function (data) {
        if (data && normalizeModel(data.model)) applyBrandModel(data.model);
      })
      .catch(function () {
        if (!normalizeModel(document.querySelector('[data-simpleadmin-brand-title]') && document.querySelector('[data-simpleadmin-brand-title]').textContent)) {
          applyBrandModel('SimpleAdmin');
        }
      });
  }
  applyTheme(storedTheme());
  initBrandModel();
  themeSelect.addEventListener('change', function () {
    try {
      if (themeSelect.value === 'auto') localStorage.removeItem('theme');
      else localStorage.setItem('theme', themeSelect.value);
    } catch (e) {}
    applyTheme(themeSelect.value);
  });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', function () { if (storedTheme() === 'auto') applyTheme('auto'); });
  function nextURL() {
    const params = new URLSearchParams(window.location.search || '');
    const value = params.get('next') || '/';
    // Same-site paths only: browsers treat "/\\host" like "//host".
    return /^\/(?![\/\\])/.test(value) ? value : '/';
  }
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    message.textContent = '';
    button.disabled = true;
    button.textContent = '登录中...';
    fetch('/api/login', {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
      body: new URLSearchParams(new FormData(form))
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (response.ok && data.ok) {
          window.location.replace(nextURL());
          return;
        }
        if (response.status === 429) {
          const seconds = Math.max(1, parseInt(response.headers.get('retry-after'), 10) || 1);
          message.textContent = '尝试次数过多，请 ' + seconds + ' 秒后再试';
        } else if (response.status === 401) {
          message.textContent = '用户名或密码错误';
        } else {
          message.textContent = '登录失败，请稍后重试';
        }
      });
    }).catch(function () {
      message.textContent = '无法连接设备，请检查网络后重试';
    }).finally(function () {
      button.disabled = false;
      button.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>
